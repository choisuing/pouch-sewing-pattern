# main에 올라오면 빌드해서 GitHub Pages에 배포한다.
# vite.config.ts의 base가 './'라 하위 경로(/pouch-sewing-pattern/)에서도 그대로 돈다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포에 필요한 최소 권한만 준다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 건 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # vite 8은 ^20.19 || >=22.12, vitest 4는 ^20 || ^22 || >=24를 요구한다.
          # 로컬 개발 환경과 맞춰 24로 고정한다.
          node-version: 24
          cache: npm

      - run: npm ci

      # 깨진 걸 올리지 않도록 테스트를 먼저 돌린다.
      # build 스크립트가 tsc --noEmit을 함께 돌리므로 타입 검사도 여기서 걸린다.
      - run: npm test

      # 다운로드 기록을 받을 주소. 저장소 Secret에 TRACK_URL이 없으면 빈 값이
      # 들어가고, 그러면 트래킹은 통째로 잠잔다 — docs/tracking.md 참고.
      - run: npm run build
        env:
          VITE_TRACK_URL: ${{ secrets.TRACK_URL }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
