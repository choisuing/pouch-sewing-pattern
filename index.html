<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사각 파우치 도안 만들기</title>
  </head>
  <body>
    <main class="page">
      <header class="head">
        <h1>사각 파우치 도안 만들기</h1>
        <p class="sub">완성 치수를 넣으면 시접까지 포함된 도안 PDF가 나옵니다.</p>
      </header>

      <section class="card">
        <h2 class="label">자주 쓰는 크기</h2>
        <div class="presets" id="presets"></div>

        <h2 class="label">완성 치수 (mm)</h2>
        <div class="inputs" id="inputs"></div>
        <p class="error" id="error" hidden></p>

        <h2 class="label">완성 예상 모습</h2>
        <div class="shape" id="shape"></div>

        <h2 class="label">전개도 미리보기</h2>
        <p class="preview-summary" id="preview-summary" aria-live="polite"></p>
        <div class="preview" id="preview"></div>
        <ul class="legend">
          <li><span class="swatch swatch-cut"></span>재단선 — 이 선대로 자릅니다</li>
          <li><span class="swatch swatch-seam"></span>완성선 — 여기를 박습니다</li>
          <li><span class="swatch swatch-seam-band"></span>시접 10mm — 이미 포함되어 있습니다</li>
          <li><span class="swatch swatch-fold"></span>접힘선 — 접어서 옆면·바닥을 만듭니다</li>
          <li><span class="swatch swatch-tile"></span>인쇄 페이지 경계 — 칸 번호는 PDF와 같습니다</li>
        </ul>

        <h2 class="label">용지</h2>
        <div class="papers" id="papers"></div>

        <button type="button" id="download" class="download">패턴 PDF 다운로드</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
